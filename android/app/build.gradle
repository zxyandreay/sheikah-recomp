plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.zxyandreay.sheikahrecomp'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.zxyandreay.sheikahrecomp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
